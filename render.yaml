services:
  - type: web
    name: dayshift-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile=false && pnpm build
    startCommand: node apps/api/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AI_PRIMARY_PROVIDER
        value: google
      - key: AI_FALLBACK_PROVIDER
        value: groq
      - key: AI_ENABLE_FALLBACK
        value: true
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPEN_METEO_BASE_URL
        value: https://air-quality-api.open-meteo.com/v1/air-quality
      - key: CACHE_PROVIDER
        value: redis
      - key: CACHE_MAX_TTL_SECONDS
        value: 86400
      - key: LOG_LEVEL
        value: info
